<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Gateway — Security Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
    }

    header {
      background: #1a1d27;
      border-bottom: 1px solid #2d3748;
      padding: 16px 32px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header h1 { font-size: 1.2rem; font-weight: 600; color: #f7fafc; }
    header .badge {
      background: #22543d;
      color: #68d391;
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .container { max-width: 1200px; margin: 0 auto; padding: 32px; }

    /* Auth bar */
    .auth-bar {
      background: #1a1d27;
      border: 1px solid #2d3748;
      border-radius: 8px;
      padding: 20px 24px;
      margin-bottom: 28px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .auth-bar label { font-size: 0.85rem; color: #a0aec0; white-space: nowrap; }

    .auth-bar input {
      flex: 1;
      min-width: 260px;
      background: #0f1117;
      border: 1px solid #2d3748;
      color: #e2e8f0;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.875rem;
      font-family: monospace;
    }

    .auth-bar input:focus { outline: none; border-color: #4299e1; }

    select {
      background: #0f1117;
      border: 1px solid #2d3748;
      color: #e2e8f0;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.875rem;
    }

    button {
      background: #3182ce;
      color: #fff;
      border: none;
      padding: 8px 20px;
      border-radius: 6px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: #2b6cb0; }
    button:disabled { background: #2d3748; cursor: not-allowed; }

    .last-updated { font-size: 0.78rem; color: #718096; margin-left: auto; }

    /* Error banner */
    #error-banner {
      display: none;
      background: #742a2a;
      border: 1px solid #e53e3e;
      color: #fed7d7;
      padding: 12px 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 0.875rem;
    }

    /* Stat cards */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }

    .card {
      background: #1a1d27;
      border: 1px solid #2d3748;
      border-radius: 8px;
      padding: 20px;
    }

    .card .label { font-size: 0.75rem; color: #718096; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
    .card .value { font-size: 2rem; font-weight: 700; line-height: 1; }
    .card .sub { font-size: 0.78rem; color: #718096; margin-top: 4px; }

    .card.green .value  { color: #68d391; }
    .card.red .value    { color: #fc8181; }
    .card.yellow .value { color: #f6e05e; }
    .card.blue .value   { color: #63b3ed; }
    .card.purple .value { color: #b794f4; }

    /* Charts */
    .charts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 28px;
    }

    @media (max-width: 720px) { .charts { grid-template-columns: 1fr; } }

    .chart-box {
      background: #1a1d27;
      border: 1px solid #2d3748;
      border-radius: 8px;
      padding: 24px;
    }

    .chart-box h3 { font-size: 0.875rem; color: #a0aec0; margin-bottom: 16px; font-weight: 600; }

    .chart-box canvas { max-height: 260px; }

    /* Events table */
    .table-box {
      background: #1a1d27;
      border: 1px solid #2d3748;
      border-radius: 8px;
      overflow: hidden;
    }

    .table-box h3 {
      font-size: 0.875rem;
      color: #a0aec0;
      font-weight: 600;
      padding: 16px 20px;
      border-bottom: 1px solid #2d3748;
    }

    table { width: 100%; border-collapse: collapse; }

    th {
      font-size: 0.72rem;
      color: #718096;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 10px 16px;
      text-align: left;
      border-bottom: 1px solid #2d3748;
    }

    td {
      font-size: 0.82rem;
      padding: 10px 16px;
      border-bottom: 1px solid #1a1d27;
      color: #cbd5e0;
    }

    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #232635; }

    .badge-type {
      display: inline-block;
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 600;
    }

    .LOGIN_SUCCESS    { background: #22543d; color: #68d391; }
    .LOGIN_FAILED     { background: #742a2a; color: #fc8181; }
    .TOKEN_INVALID    { background: #744210; color: #f6e05e; }
    .RATE_LIMIT_EXCEEDED { background: #553c9a; color: #b794f4; }
    .INPUT_REJECTED   { background: #2a4365; color: #63b3ed; }

    .empty-state {
      text-align: center;
      padding: 40px;
      color: #4a5568;
      font-size: 0.875rem;
    }
  </style>
</head>
<body>

<header>
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4299e1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
  </svg>
  <h1>Secure Gateway</h1>
  <span class="badge">Security Dashboard</span>
</header>

<div class="container">

  <div class="auth-bar">
    <label>JWT Token</label>
    <input id="token-input" type="password" placeholder="Paste your ADMIN JWT token here…">
    <label>Window</label>
    <select id="window-select">
      <option value="1">Last 1h</option>
      <option value="24" selected>Last 24h</option>
      <option value="168">Last 7d</option>
    </select>
    <button id="load-btn" onclick="loadAll()">Load</button>
    <span class="last-updated" id="last-updated"></span>
  </div>

  <div id="error-banner"></div>

  <div class="cards">
    <div class="card green">
      <div class="label">Login Success</div>
      <div class="value" id="m-success">—</div>
      <div class="sub" id="m-window"></div>
    </div>
    <div class="card red">
      <div class="label">Login Failed</div>
      <div class="value" id="m-failed">—</div>
      <div class="sub" id="m-failure-rate"></div>
    </div>
    <div class="card yellow">
      <div class="label">Rate Limited</div>
      <div class="value" id="m-ratelimit">—</div>
      <div class="sub">requests blocked</div>
    </div>
    <div class="card blue">
      <div class="label">Invalid Tokens</div>
      <div class="value" id="m-token">—</div>
      <div class="sub">expired or tampered</div>
    </div>
    <div class="card purple">
      <div class="label">Input Rejected</div>
      <div class="value" id="m-input">—</div>
      <div class="sub">XSS / SQLi blocked</div>
    </div>
  </div>

  <div class="charts">
    <div class="chart-box">
      <h3>Events by Type</h3>
      <canvas id="type-chart"></canvas>
    </div>
    <div class="chart-box">
      <h3>Top Endpoints</h3>
      <canvas id="endpoint-chart"></canvas>
    </div>
  </div>

  <div class="charts">
    <div class="chart-box">
      <h3>Top Source IPs</h3>
      <canvas id="ip-chart"></canvas>
    </div>
  </div>

  <div class="table-box">
    <h3>Recent Security Events</h3>
    <div id="events-container">
      <div class="empty-state">Load metrics to see recent events.</div>
    </div>
  </div>

</div>

<script>
  let typeChart = null;
  let endpointChart = null;
  let ipChart = null;

  function token() {
    return document.getElementById('token-input').value.trim();
  }

  function headers() {
    return { 'Authorization': 'Bearer ' + token(), 'Content-Type': 'application/json' };
  }

  function showError(msg) {
    const el = document.getElementById('error-banner');
    el.textContent = msg;
    el.style.display = 'block';
  }

  function hideError() {
    document.getElementById('error-banner').style.display = 'none';
  }

  async function loadAll() {
    if (!token()) { showError('Please enter a JWT token.'); return; }
    hideError();
    document.getElementById('load-btn').disabled = true;

    const windowHours = document.getElementById('window-select').value;

    try {
      const [metricsRes, eventsRes] = await Promise.all([
        fetch('/admin/metrics?windowHours=' + windowHours, { headers: headers() }),
        fetch('/admin/events?last=' + windowHours + 'h', { headers: headers() })
      ]);

      if (metricsRes.status === 401 || metricsRes.status === 403) {
        showError('Access denied. Make sure you are using an ADMIN JWT token.');
        return;
      }
      if (!metricsRes.ok) { showError('Failed to load metrics: HTTP ' + metricsRes.status); return; }

      const metrics = await metricsRes.json();
      const events  = eventsRes.ok ? await eventsRes.json() : [];

      renderMetrics(metrics);
      renderEvents(events);

      document.getElementById('last-updated').textContent =
        'Updated ' + new Date().toLocaleTimeString();
    } catch (e) {
      showError('Network error: ' + e.message);
    } finally {
      document.getElementById('load-btn').disabled = false;
    }
  }

  function renderMetrics(m) {
    const win = m.windowHours + 'h window';
    document.getElementById('m-success').textContent      = m.loginStats.successful;
    document.getElementById('m-failed').textContent       = m.loginStats.failed;
    document.getElementById('m-failure-rate').textContent = (m.loginStats.failureRate * 100).toFixed(1) + '% failure rate';
    document.getElementById('m-ratelimit').textContent    = m.rateLimitRejections;
    document.getElementById('m-token').textContent        = m.tokenInvalidEvents;
    document.getElementById('m-input').textContent        = m.inputRejections;
    document.getElementById('m-window').textContent       = win;

    // Events by type — doughnut
    const typeLabels = Object.keys(m.eventsByType);
    const typeData   = Object.values(m.eventsByType);
    const typeColors = ['#68d391','#fc8181','#f6e05e','#b794f4','#63b3ed'];

    if (typeChart) typeChart.destroy();
    typeChart = new Chart(document.getElementById('type-chart'), {
      type: 'doughnut',
      data: {
        labels: typeLabels,
        datasets: [{ data: typeData, backgroundColor: typeColors, borderWidth: 0 }]
      },
      options: {
        plugins: { legend: { labels: { color: '#a0aec0', font: { size: 11 } } } },
        cutout: '60%'
      }
    });

    // Top endpoints — horizontal bar
    const epLabels = m.topEndpoints.map(e => e.endpoint);
    const epData   = m.topEndpoints.map(e => e.count);

    if (endpointChart) endpointChart.destroy();
    endpointChart = new Chart(document.getElementById('endpoint-chart'), {
      type: 'bar',
      data: {
        labels: epLabels,
        datasets: [{ label: 'Events', data: epData, backgroundColor: '#4299e1', borderRadius: 4 }]
      },
      options: {
        indexAxis: 'y',
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { color: '#718096' }, grid: { color: '#2d3748' } },
          y: { ticks: { color: '#a0aec0', font: { size: 11 } }, grid: { display: false } }
        }
      }
    });

    // Top IPs — horizontal bar
    const ipLabels = m.topIps.map(i => i.ip);
    const ipData   = m.topIps.map(i => i.count);

    if (ipChart) ipChart.destroy();
    ipChart = new Chart(document.getElementById('ip-chart'), {
      type: 'bar',
      data: {
        labels: ipLabels,
        datasets: [{ label: 'Events', data: ipData, backgroundColor: '#b794f4', borderRadius: 4 }]
      },
      options: {
        indexAxis: 'y',
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { color: '#718096' }, grid: { color: '#2d3748' } },
          y: { ticks: { color: '#a0aec0', font: { size: 11 } }, grid: { display: false } }
        }
      }
    });
  }

  function renderEvents(events) {
    const container = document.getElementById('events-container');
    if (!events.length) {
      container.innerHTML = '<div class="empty-state">No events in this time window.</div>';
      return;
    }

    const rows = events.slice(0, 20).map(e => `
      <tr>
        <td>${new Date(e.timestamp).toLocaleString()}</td>
        <td><span class="badge-type ${e.eventType}">${e.eventType}</span></td>
        <td>${e.ip || '—'}</td>
        <td>${e.endpoint}</td>
        <td>${e.userEmail || '—'}</td>
        <td>${e.details || '—'}</td>
      </tr>`).join('');

    container.innerHTML = `
      <table>
        <thead>
          <tr>
            <th>Timestamp</th><th>Type</th><th>IP</th>
            <th>Endpoint</th><th>User</th><th>Details</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>`;
  }
</script>

</body>
</html>
